<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 100'
    style='background-color: #00000000;'
    width='600px' height='100px'>

    
                <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='7000ms' fill="freeze"
                    values='m0,35 h0 ; m0,35 h0 ; m0,35 h600 ; m0,35 h600' keyTimes='0;0;0.85714285714286;1' />
                    </path>
    <text font-family='" Google Sans Code", monospace' fill='#F77849' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi there! 
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s'
                    dur='14000ms' fill="freeze"
                    values='m0,70 h0 ; m0,70 h0 ; m0,70 h600 ; m0,70 h600' keyTimes='0;0.5;0.92857142857143;1' />
                    </path>
    <text font-family='" Google Sans Code", monospace' fill='#F77849' font-size='30'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            I&#039;m Mike, a nerd and petrolhead ⚙
        </textPath>
    </text>
</svg>
